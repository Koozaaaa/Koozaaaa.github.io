<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une lettre est arrivée</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Mrs+Saint+Delafield&family=IM+Fell+English+SC&display=swap');

:root{
  --parchment: #ecdcb4;
  --parchment-dark: #d3bb85;
  --parchment-shadow: #b89a68;
  --ink: #2e2126;
  --wax: #7a1f2b;
  --wax-dark: #4e1119;
  --wax-light: #a4394a;
  --gold: #b8862b;
  --gold-light: #d9b45f;
  --desk: #1c130d;
  --desk-light: #34231a;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  height:100%;
  width:100%;
  overflow:hidden;
  font-family:'Cormorant Garamond', Georgia, serif;
  background:var(--desk);
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:560px;
  overflow:hidden;
}

/* ---------- DESK BACKGROUND ---------- */
.desk-bg{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 15%, rgba(255,225,170,0.08), transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0) 4px),
    linear-gradient(160deg, var(--desk-light), var(--desk) 70%);
}
.desk-bg::after{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,0.55) 100%);
}

/* ---------- SETUP PANEL ---------- */
#setupToggle{
  position:absolute; top:18px; right:18px; z-index:50;
  width:42px; height:42px; border-radius:50%;
  background:var(--parchment-shadow, #b89a68);
  border:1px solid var(--gold);
  color:var(--ink);
  font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,0.4);
  transition:transform .2s ease;
}
#setupToggle:hover{ transform:rotate(35deg); }
#setupToggle:focus-visible{ outline:2px solid var(--gold-light); outline-offset:2px; }

.setup-panel{
  position:absolute; top:70px; right:18px; z-index:50;
  width:min(320px, 84vw);
  background:var(--parchment);
  border:1px solid var(--parchment-shadow, #b89a68);
  border-radius:6px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  color:var(--ink);
  transform-origin:top right;
  transition:opacity .25s ease, transform .25s ease;
}
.setup-panel h2{
  margin:0 0 12px; font-family:'IM Fell English SC', serif;
  font-size:17px; letter-spacing:1px; color:var(--wax);
}
.setup-panel label{
  display:block; font-size:14px; margin:12px 0 4px; color:var(--ink);
  font-weight:600;
}
.setup-panel input[type="text"]{
  width:100%; padding:7px 9px; border-radius:3px; border:1px solid var(--parchment-shadow, #b89a68);
  background:#fbf3dd; font-family:inherit; font-size:15px; color:var(--ink);
}
.setup-panel input[type="file"]{
  width:100%; font-size:13px; margin-top:2px;
}
.setup-panel .file-status{
  font-size:12px; margin-top:6px; color:#5b4a2f; font-style:italic;
}
.setup-panel button.primary{
  margin-top:16px; width:100%; padding:10px; border:none; border-radius:4px;
  background:var(--wax); color:#f2e2c4; font-family:'IM Fell English SC', serif;
  font-size:15px; letter-spacing:1px; cursor:pointer; transition:background .2s ease;
}
.setup-panel button.primary:hover{ background:var(--wax-light); }
.setup-panel button.primary:disabled{ opacity:.5; cursor:not-allowed; }
.hidden-panel{ opacity:0; pointer-events:none; transform:scale(.96) translateY(-6px); }

/* ---------- NOTIFICATION ---------- */
.notification{
  position:absolute; top:26px; left:50%;
  width:min(380px, 88vw);
  transform:translate(-50%,-140%);
  background:linear-gradient(180deg,#f4e6c4,#e8d3a0);
  border:1px solid var(--gold);
  border-radius:8px;
  padding:14px 16px;
  display:flex; gap:12px; align-items:center;
  cursor:pointer;
  box-shadow:0 12px 26px rgba(0,0,0,0.45);
  transition:transform .6s cubic-bezier(.2,1.4,.4,1), opacity .4s ease;
  z-index:40;
}
.notification.show{ transform:translate(-50%,0); }
.notification.gone{ transform:translate(-50%,-140%); opacity:0; }
.notification .seal-dot{
  flex:none; width:40px; height:40px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 60%, var(--wax-dark));
  display:flex; align-items:center; justify-content:center;
  color:#f2e2c4; font-family:'Mrs Saint Delafield', cursive; font-size:20px;
  box-shadow:inset 0 0 6px rgba(0,0,0,0.4);
}
.notification .notif-text{ color:var(--ink); line-height:1.25; }
.notification .notif-title{ font-weight:700; font-size:15px; }
.notification .notif-sub{ font-size:13px; opacity:.75; font-style:italic; }

/* ---------- ENVELOPE SCENE ---------- */
.scene{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden;
  transition:opacity .5s ease;
}
.scene.show{ opacity:1; visibility:visible; }

.envelope-wrap{
  position:relative;
  width:min(360px, 82vw);
  aspect-ratio:3/2;
  perspective:1400px;
}
.envelope-body{
  position:absolute; inset:0;
  background:linear-gradient(155deg,#e4c98f,#c9a662);
  border-radius:4px;
  box-shadow:0 20px 45px rgba(0,0,0,0.5);
  overflow:visible;
}
.envelope-address{
  position:absolute; left:0; right:0; top:38%;
  text-align:center; color:var(--ink);
  font-family:'Mrs Saint Delafield', cursive;
  pointer-events:none;
  transition:opacity .3s ease;
}
.envelope-address .to-line{ font-size:26px; }
.envelope-address .from-line{ font-size:15px; opacity:.7; margin-top:2px; }

.envelope-flap{
  position:absolute; top:0; left:0; width:100%; height:58%;
  background:linear-gradient(160deg,#dcbb7c,#b6905a);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transition:transform 1.1s cubic-bezier(.6,0,.3,1);
  box-shadow:0 3px 6px rgba(0,0,0,0.25);
  z-index:6;
}
.envelope-flap.open{ transform:rotateX(178deg); }

.seal{
  position:absolute; left:50%; top:38%;
  transform:translate(-50%,-50%);
  width:64px; height:64px; z-index:8; cursor:pointer;
}
.seal .half{
  position:absolute; inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 55%, var(--wax-dark));
  box-shadow:0 4px 10px rgba(0,0,0,0.5), inset 0 0 8px rgba(0,0,0,0.35);
  display:flex; align-items:center; justify-content:center;
  color:#f2e2c4; font-family:'Mrs Saint Delafield', cursive; font-size:30px;
  transition:transform .55s cubic-bezier(.4,0,.2,1), opacity .55s ease;
}
.seal .half.left{ clip-path:polygon(0 0,60% 0,40% 100%,0 100%); }
.seal .half.right{ clip-path:polygon(60% 0,100% 0,100% 100%,40% 100%); }
.seal.cracked .half.left{ transform:translate(-14px,10px) rotate(-18deg); opacity:0; }
.seal.cracked .half.right{ transform:translate(14px,10px) rotate(18deg); opacity:0; }
.seal:hover .half{ filter:brightness(1.08); }
.seal .hint{
  position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
  font-size:12px; color:#d9c690; opacity:.7; white-space:nowrap;
  font-style:italic;
}

.paper-peek{
  position:absolute; left:8%; right:8%; top:6%;
  height:70%;
  background:var(--parchment);
  border-radius:2px;
  box-shadow:0 6px 14px rgba(0,0,0,0.3);
  transform:translateY(0);
  transition:transform 1s cubic-bezier(.3,0,.2,1) .3s;
  z-index:4;
}
.paper-peek.rise{ transform:translateY(-64%); }

/* ---------- LETTER VIEWER ---------- */
.letter-viewer{
  flex-direction:column;
  gap:14px;
}
.page-frame{
  position:relative;
  width:min(420px, 88vw);
  max-height:74vh;
  aspect-ratio:3/4;
  background:var(--parchment);
  border-radius:3px;
  box-shadow:0 20px 50px rgba(0,0,0,0.55);
  overflow:hidden;
}
.page-frame img{
  width:100%; height:100%; object-fit:contain; display:block;
  background:var(--parchment);
}
.page-frame .empty-state{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:20px; text-align:center; color:var(--ink);
}
.page-frame .empty-state p{ margin:0; font-size:15px; line-height:1.4; max-width:280px; }
.page-frame.turning img{ animation:pageTurn .5s ease; }
@keyframes pageTurn{
  0%{ transform:rotateY(0deg); }
  50%{ transform:rotateY(-90deg); filter:brightness(.7); }
  51%{ transform:rotateY(90deg); }
  100%{ transform:rotateY(0deg); }
}

.viewer-controls{
  display:flex; align-items:center; gap:16px; color:var(--parchment);
}
.viewer-controls button{
  background:var(--wax); border:1px solid var(--gold);
  color:#f2e2c4; width:38px; height:38px; border-radius:50%;
  font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s ease, opacity .2s ease;
}
.viewer-controls button:hover{ background:var(--wax-light); }
.viewer-controls button:disabled{ opacity:.3; cursor:default; }
.viewer-controls .page-count{ font-size:14px; letter-spacing:1px; opacity:.85; }

.close-btn{
  position:absolute; top:16px; left:16px; z-index:30;
  background:transparent; border:1px solid var(--parchment-shadow, #b89a68);
  color:var(--parchment); border-radius:20px; padding:6px 14px;
  font-family:'IM Fell English SC', serif; font-size:13px; letter-spacing:1px;
  cursor:pointer; opacity:.7; transition:opacity .2s ease;
}
.close-btn:hover{ opacity:1; }

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
}

.sr-only{
  position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);
}
</style>
</head>
<body>
<div id="app">
  <div class="desk-bg"></div>

  <button id="setupToggle" aria-expanded="false" aria-controls="setupPanel" title="Régler la lettre">⚙</button>

  <div class="setup-panel hidden-panel" id="setupPanel">
    <h2>Préparer la lettre</h2>
    <label for="senderName">Expéditeur·ice</label>
    <input type="text" id="senderName" value="Khira">
    <label for="recipientName">Destinataire</label>
    <input type="text" id="recipientName" value="Adrian">
    <label for="pageInput">Pages de la lettre (PNG, dans l'ordre)</label>
    <input type="file" id="pageInput" accept="image/png,image/jpeg" multiple>
    <div class="file-status" id="fileStatus">Aucune page ajoutée pour l'instant.</div>
    <button class="primary" id="startBtn">Faire arriver la lettre</button>
  </div>

  <div class="notification" id="notification" role="button" tabindex="0">
    <div class="seal-dot" id="notifInitial">K</div>
    <div class="notif-text">
      <div class="notif-title" id="notifTitle">Vous avez reçu une lettre de Khira !</div>
      <div class="notif-sub">Touchez pour l'ouvrir</div>
    </div>
  </div>

  <div class="scene" id="envelopeScene">
    <div class="envelope-wrap">
      <div class="paper-peek" id="paperPeek"></div>
      <div class="envelope-body">
        <div class="envelope-address">
          <div class="to-line" id="toLine">Pour Adrian</div>
          <div class="from-line" id="fromLine">— de la part de Khira</div>
        </div>
      </div>
      <div class="envelope-flap" id="flap"></div>
      <div class="seal" id="seal" role="button" tabindex="0" aria-label="Décacheter la lettre">
        <div class="half left" id="sealInitLeft">K</div>
        <div class="half right" id="sealInitRight">K</div>
        <div class="hint">briser le cachet</div>
      </div>
    </div>
  </div>

  <div class="scene letter-viewer" id="letterScene">
    <button class="close-btn" id="closeBtn">↩ refermer</button>
    <div class="page-frame" id="pageFrame">
      <div class="empty-state" id="emptyState">
        <p>Aucune page n'a été ajoutée. Ouvre le réglage ⚙ en haut à droite pour importer les PNG de la lettre.</p>
      </div>
    </div>
    <div class="viewer-controls" id="viewerControls" style="display:none;">
      <button id="prevBtn" aria-label="Page précédente">‹</button>
      <span class="page-count" id="pageCount">1 / 1</span>
      <button id="nextBtn" aria-label="Page suivante">›</button>
    </div>
  </div>
</div>

<script>
(function(){
  const state = {
    sender: "Khira",
    recipient: "Adrian",
    pages: [], // data URLs
    currentPage: 0
  };

  const el = (id) => document.getElementById(id);
  const setupToggle = el('setupToggle');
  const setupPanel = el('setupPanel');
  const senderInput = el('senderName');
  const recipientInput = el('recipientName');
  const pageInput = el('pageInput');
  const fileStatus = el('fileStatus');
  const startBtn = el('startBtn');

  const notification = el('notification');
  const notifInitial = el('notifInitial');
  const notifTitle = el('notifTitle');

  const envelopeScene = el('envelopeScene');
  const toLine = el('toLine');
  const fromLine = el('fromLine');
  const flap = el('flap');
  const seal = el('seal');
  const sealInitLeft = el('sealInitLeft');
  const sealInitRight = el('sealInitRight');
  const paperPeek = el('paperPeek');

  const letterScene = el('letterScene');
  const pageFrame = el('pageFrame');
  const emptyState = el('emptyState');
  const viewerControls = el('viewerControls');
  const prevBtn = el('prevBtn');
  const nextBtn = el('nextBtn');
  const pageCount = el('pageCount');
  const closeBtn = el('closeBtn');

  // ---------- Setup panel ----------
  setupToggle.addEventListener('click', () => {
    const willOpen = setupPanel.classList.contains('hidden-panel');
    setupPanel.classList.toggle('hidden-panel', !willOpen);
    setupToggle.setAttribute('aria-expanded', String(willOpen));
  });

  pageInput.addEventListener('change', () => {
    const files = Array.from(pageInput.files || []);
    if(files.length === 0) return;
    state.pages = [];
    let loaded = 0;
    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        state.pages[idx] = e.target.result;
        loaded++;
        if(loaded === files.length){
          fileStatus.textContent = files.length + " page(s) chargée(s).";
        }
      };
      reader.readAsDataURL(file);
    });
  });

  startBtn.addEventListener('click', () => {
    state.sender = (senderInput.value || "Khira").trim();
    state.recipient = (recipientInput.value || "Adrian").trim();
    applyNames();
    setupPanel.classList.add('hidden-panel');
    setupToggle.setAttribute('aria-expanded', 'false');
    showNotification();
  });

  function applyNames(){
    const initial = state.sender.charAt(0).toUpperCase() || "?";
    notifInitial.textContent = initial;
    notifTitle.textContent = "Vous avez reçu une lettre de " + state.sender + " !";
    toLine.textContent = "Pour " + state.recipient;
    fromLine.textContent = "— de la part de " + state.sender;
    sealInitLeft.textContent = initial;
    sealInitRight.textContent = initial;
  }
  applyNames();

  // ---------- Notification ----------
  function showNotification(){
    notification.classList.remove('gone');
    requestAnimationFrame(() => notification.classList.add('show'));
  }
  function openEnvelopeScene(){
    notification.classList.remove('show');
    notification.classList.add('gone');
    setTimeout(() => {
      envelopeScene.classList.add('show');
    }, 350);
  }
  notification.addEventListener('click', openEnvelopeScene);
  notification.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelopeScene(); }
  });

  // ---------- Envelope / seal ----------
  let opened = false;
  function crackSeal(){
    if(opened) return;
    opened = true;
    playPaperSound(true);
    seal.classList.add('cracked');
    setTimeout(() => { flap.classList.add('open'); }, 150);
    setTimeout(() => { paperPeek.classList.add('rise'); playPaperSound(false); }, 500);
    setTimeout(() => { openLetterScene(); }, 1700);
  }
  seal.addEventListener('click', crackSeal);
  seal.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); crackSeal(); }
  });

  function openLetterScene(){
    envelopeScene.classList.remove('show');
    setTimeout(() => {
      letterScene.classList.add('show');
      renderPage();
    }, 250);
  }

  closeBtn.addEventListener('click', () => {
    letterScene.classList.remove('show');
    envelopeScene.classList.remove('show');
    flap.classList.remove('open');
    seal.classList.remove('cracked');
    paperPeek.classList.remove('rise');
    opened = false;
    state.currentPage = 0;
    setTimeout(showNotification, 300);
  });

  // ---------- Page viewer ----------
  function renderPage(){
    pageFrame.querySelectorAll('img').forEach(n => n.remove());
    if(state.pages.length === 0){
      emptyState.style.display = 'flex';
      viewerControls.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    viewerControls.style.display = 'flex';
    const img = document.createElement('img');
    img.src = state.pages[state.currentPage];
    img.alt = "Page " + (state.currentPage + 1) + " de la lettre";
    pageFrame.appendChild(img);
    pageCount.textContent = (state.currentPage + 1) + " / " + state.pages.length;
    prevBtn.disabled = state.currentPage === 0;
    nextBtn.disabled = state.currentPage === state.pages.length - 1;
  }
  function turnPage(dir){
    const next = state.currentPage + dir;
    if(next < 0 || next >= state.pages.length) return;
    state.currentPage = next;
    pageFrame.classList.remove('turning');
    void pageFrame.offsetWidth;
    pageFrame.classList.add('turning');
    playPaperSound(false, .5);
    renderPage();
  }
  prevBtn.addEventListener('click', () => turnPage(-1));
  nextBtn.addEventListener('click', () => turnPage(1));

  // ---------- Synthesized paper sound (no external audio file needed) ----------
  let audioCtx;
  function getCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function playPaperSound(isSnap, volume){
    const ctx = getCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    const dur = isSnap ? 0.12 : 0.7;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      // layered crackle: random noise bursts, denser for paper rustle
      const burst = Math.random() < (isSnap ? 0.9 : 0.35) ? (Math.random()*2-1) : 0;
      data[i] = burst * (1 - i/bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = isSnap ? 'highpass' : 'bandpass';
    filter.frequency.value = isSnap ? 2500 : 1800;
    filter.Q.value = isSnap ? 0.7 : 0.9;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime((volume || 0.5), ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + dur);
  }

  // Reveal the notification once on load, after a short beat
  setTimeout(showNotification, 500);
})();
</script>
</body>
</html>
